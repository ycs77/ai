setupVersion: 3

# Basic
modelRoles:
  default: openai-codex/gpt-6.1-sol:medium
  smol: openai-codex/gpt-6-luna:low
  slow: openai-codex/gpt-6.1-sol:high
  # advisor: opencode-zen/claude-opus-5-5
modelPresets:
  codex:
    modelRoles:
      default: openai-codex/gpt-6.1-sol:medium
      smol: openai-codex/gpt-6-luna:low
      slow: openai-codex/gpt-6.1-sol:high
      # advisor: opencode-zen/claude-opus-5-5
  claude:
    modelRoles:
      default: opencode-zen/claude-opus-5-5:medium
      smol: opencode-zen/claude-haiku-5-5:low
      slow: opencode-zen/claude-opus-5-5:max
  gemini3:
    modelRoles:
      default: opencode-zen/gemini-3.8-flash:medium
  gemini4:
    modelRoles:
      default: opencode-go/gemini-4-argon:medium
      smol: opencode-zen/gemini-3.8-flash:low
      slow: opencode-go/gemini-4-argon:high
  glm:
    modelRoles:
      default: opencode-go/glm-5.3:high
      smol: opencode-go/glm-5.3-flash:low
      slow: opencode-go/glm-5.3:max
  kimi:
    modelRoles:
      default: opencode-go/kimi-k3
# advisor:
#   enabled: true
symbolPreset: unicode

# Theme
theme:
  dark: titanium
  light: light
composer:
  shape: claude

# Auto update
update:
  auto: false

# Auto QA
dev:
  autoqa: false
  autoqaConsent: denied

bash:
  patterns:
    # Ask: Git destructive / external
    - match: "git commit *"
      approval: prompt
    - match: "git push *"
      approval: prompt
    - match: "git reset --hard*"
      approval: prompt
    - match: "git clean*"
      approval: prompt
    - match: "git rebase*"
      approval: prompt
    - match: "git checkout -- *"
      approval: prompt
    - match: "git checkout ."
      approval: prompt
    - match: "git stash drop*"
      approval: prompt
    - match: "git branch -D*"
      approval: prompt

    # Ask: Package install / remove (supply-chain risk)
    - match: "npm install *"
      approval: prompt
    - match: "npm i *"
      approval: prompt
    - match: "npm uninstall *"
      approval: prompt
    - match: "npm rm *"
      approval: prompt
    - match: "yarn install *"
      approval: prompt
    - match: "yarn add *"
      approval: prompt
    - match: "pnpm install *"
      approval: prompt
    - match: "pnpm i *"
      approval: prompt
    - match: "pnpm uninstall *"
      approval: prompt
    - match: "pip install *"
      approval: prompt
    - match: "pip3 install *"
      approval: prompt
    - match: "uv add *"
      approval: prompt
    - match: "uv pip install *"
      approval: prompt
    - match: "composer require *"
      approval: prompt
    - match: "composer install *"
      approval: prompt
    - match: "composer update*"
      approval: prompt

    # Ask: Docker data loss
    - match: "docker system prune*"
      approval: prompt
    - match: "docker volume rm *"
      approval: prompt
    - match: "docker rmi *"
      approval: prompt
    - match: "docker rm *"
      approval: prompt
