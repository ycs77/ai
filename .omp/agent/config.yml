setupVersion: 2

# Basic
modelRoles:
  default: openai-codex/gpt-6-sol:medium
  smol: openai-codex/gpt-6-luna:low
  slow: openai-codex/gpt-6-sol:max
  advisor: opencode-go/glm-5.2:high
  # default: opencode-go/glm-5.2:high
  # smol: opencode-go/glm-5.3-flash:low
  # slow: opencode-go/glm-5.3:max
  # vision: opencode-go/glm-5.3-flash:high
  # advisor: openai-codex/gpt-6-sol:medium
advisor:
  enabled: true
symbolPreset: unicode
# shellPath: C:\Program Files\Git\bin\bash.exe

# Theme
theme:
  dark: titanium
  light: light
composer:
  shape: claude

bash:
  patterns:
    # Ask: Git destructive / external
    - match: "git commit *"
      approval: prompt
    - match: "git push *"
      approval: prompt
    - match: "git reset --hard*"
      approval: prompt
    - match: "git clean*"
      approval: prompt
    - match: "git rebase*"
      approval: prompt
    - match: "git checkout -- *"
      approval: prompt
    - match: "git checkout ."
      approval: prompt
    - match: "git stash drop*"
      approval: prompt
    - match: "git branch -D*"
      approval: prompt

    # Ask: Package install / remove (supply-chain risk)
    - match: "npm install *"
      approval: prompt
    - match: "npm i *"
      approval: prompt
    - match: "npm uninstall *"
      approval: prompt
    - match: "npm rm *"
      approval: prompt
    - match: "yarn install *"
      approval: prompt
    - match: "yarn add *"
      approval: prompt
    - match: "pnpm install *"
      approval: prompt
    - match: "pnpm i *"
      approval: prompt
    - match: "pnpm uninstall *"
      approval: prompt
    - match: "pip install *"
      approval: prompt
    - match: "pip3 install *"
      approval: prompt
    - match: "uv add *"
      approval: prompt
    - match: "uv pip install *"
      approval: prompt
    - match: "composer require *"
      approval: prompt
    - match: "composer install *"
      approval: prompt
    - match: "composer update*"
      approval: prompt

    # Ask: Docker data loss
    - match: "docker system prune*"
      approval: prompt
    - match: "docker volume rm *"
      approval: prompt
    - match: "docker rmi *"
      approval: prompt
    - match: "docker rm *"
      approval: prompt

# Auto QA
dev:
  autoqa: false
  autoqaConsent: denied
