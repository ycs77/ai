setupVersion: 1

# Basic
modelRoles:
  # default: opencode-go/glm-5.2
  default: openai-codex/gpt-5.6-terra:high
  smol: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-sol:max
  plan: openai-codex/gpt-5.6-sol:max
symbolPreset: unicode
# shellPath: C:\Program Files\Git\bin\bash.exe

# Theme
theme:
  dark: titanium
  light: light

# Tools Approval
# write = auto-approve read/write tiers; exec requires prompt
# permission-guard owns protected paths and ambiguous shell syntax; bash.patterns
# below owns literal command side effects and process-environment disclosure.
# CRITICAL_BASH_PATTERNS (built-in) covers dangerous commands not listed here
tools:
  approvalMode: write

bash:
  patterns:
    # Deny: Process environment exposure
    # Kept here because permission-guard protects paths, not process environment output.
    - match: "env"
      approval: deny
    - match: "printenv"
      approval: deny

    # Deny: Disk-level destruction
    - match: "rm -rf /"
      approval: deny
    - match: "format*"
      approval: deny
    - match: "diskpart*"
      approval: deny
    - match: "dd*"
      approval: deny
    - match: "mkfs*"
      approval: deny
    - match: "sudo rm*"
      approval: deny
    - match: "*chmod -R* /"
      approval: deny
    - match: "*chown -R* /"
      approval: deny
    - match: "*> /dev/sd*"
      approval: deny
    - match: "*shred /dev/*"
      approval: deny
    - match: "*cryptsetup*"
      approval: deny
    - match: ":()*"
      approval: deny

    # Deny: System power control
    - match: "shutdown*"
      approval: deny
    - match: "reboot*"
      approval: deny
    - match: "halt*"
      approval: deny
    - match: "poweroff*"
      approval: deny
    - match: "init 0"
      approval: deny
    - match: "kill -9 1*"
      approval: deny

    # Deny: System config destruction
    - match: "*> /etc/passwd*"
      approval: deny
    - match: "*> /etc/shadow*"
      approval: deny
    - match: "*> /etc/sudoers*"
      approval: deny
    - match: "*|*tee* /etc/passwd*"
      approval: deny
    - match: "*|*tee* /etc/shadow*"
      approval: deny
    - match: "*|*tee* /etc/sudoers*"
      approval: deny

    # Deny: Registry deletion
    - match: "reg delete*"
      approval: deny

    # Deny: Public package publish (irreversible)
    - match: "npm publish*"
      approval: deny
    - match: "yarn publish*"
      approval: deny
    - match: "pnpm publish*"
      approval: deny

    # Deny: Network exfil
    - match: "nc *-e *"
      approval: deny
    - match: "nc *-c *"
      approval: deny

    # Deny: Dynamic and opaque command execution
    - match: "powershell *-EncodedCommand*"
      approval: deny
    - match: "powershell *-encodedcommand*"
      approval: deny
    - match: "powershell.exe *-EncodedCommand*"
      approval: deny
    - match: "powershell.exe *-encodedcommand*"
      approval: deny
    - match: "pwsh *-EncodedCommand*"
      approval: deny
    - match: "pwsh *-encodedcommand*"
      approval: deny
    - match: "pwsh.exe *-EncodedCommand*"
      approval: deny
    - match: "pwsh.exe *-encodedcommand*"
      approval: deny
    - match: "powershell *--%*"
      approval: deny
    - match: "powershell.exe *--%*"
      approval: deny
    - match: "pwsh *--%*"
      approval: deny
    - match: "pwsh.exe *--%*"
      approval: deny

    # Ask: Direct deletion commands (rm is handled by permission-guard)
    - match: "*rmdir*"
      approval: prompt
    - match: "unlink*"
      approval: prompt
    - match: "*Remove-Item*"
      approval: prompt
    - match: "del*"
      approval: prompt
    - match: "erase*"
      approval: prompt
    - match: "find * -delete*"
      approval: prompt

    # Ask: Process kill
    - match: "taskkill*"
      approval: prompt
    - match: "kill*"
      approval: prompt

    # Ask: File overwrite / remote transfer
    - match: "mv -f*"
      approval: prompt
    - match: "mv --force*"
      approval: prompt
    - match: "scp*"
      approval: prompt
    - match: "rsync*"
      approval: prompt
    - match: "ssh*"
      approval: prompt

    # Ask: System ownership / permissions
    - match: "icacls*"
      approval: prompt
    - match: "takeown*"
      approval: prompt
    - match: "chmod -R*"
      approval: prompt
    - match: "chown -R*"
      approval: prompt

    # Ask: Git destructive / external
    - match: "git commit *"
      approval: prompt
    - match: "git push *"
      approval: prompt
    - match: "git reset --hard*"
      approval: prompt
    - match: "git clean*"
      approval: prompt
    - match: "git rebase*"
      approval: prompt
    - match: "git checkout -- *"
      approval: prompt
    - match: "git checkout ."
      approval: prompt
    - match: "git stash drop*"
      approval: prompt
    - match: "git branch -D*"
      approval: prompt

    # Ask: Package install / remove (supply-chain risk)
    - match: "npm install*"
      approval: prompt
    - match: "npm i *"
      approval: prompt
    - match: "npm ci*"
      approval: prompt
    - match: "npm uninstall*"
      approval: prompt
    - match: "npm rm *"
      approval: prompt
    - match: "yarn"
      approval: prompt
    - match: "yarn install*"
      approval: prompt
    - match: "yarn add*"
      approval: prompt
    - match: "pnpm install*"
      approval: prompt
    - match: "pnpm i *"
      approval: prompt
    - match: "pnpm uninstall*"
      approval: prompt
    - match: "pip install*"
      approval: prompt
    - match: "pip3 install*"
      approval: prompt
    - match: "uv add*"
      approval: prompt
    - match: "uv pip install*"
      approval: prompt
    - match: "composer require*"
      approval: prompt
    - match: "composer install*"
      approval: prompt
    - match: "composer update*"
      approval: prompt

    # Ask: Docker data loss
    - match: "docker system prune*"
      approval: prompt
    - match: "docker volume rm*"
      approval: prompt
    - match: "docker rmi*"
      approval: prompt
    - match: "docker rm*"
      approval: prompt

    # Catch-all: allow everything else (first-match wins, must be last)
    - match: "*"
      approval: allow

# Auto QA
dev:
  autoqa: false
  autoqaConsent: "denied"
